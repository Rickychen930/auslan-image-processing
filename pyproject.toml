[project]
name = "auslan"
version = "0.1.0"
description = "Auslan fingerspelling recognition: five method families under a shared evaluation pipeline (UTS 42177, Group 9)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "opencv-python",
    "pillow",
    "imagehash",
    "pyyaml",
    "tqdm",
    "joblib",
    "torch",
    "torchvision",
    "mediapipe",
    "kaggle",
]

[project.scripts]
auslan = "auslan.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auslan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
